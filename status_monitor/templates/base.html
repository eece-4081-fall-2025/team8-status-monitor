{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Status Monitor{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
    </head>
    <body>
        <header class="header">
            <h1>Status Monitor</h1>
            <nav class="navbar">
                <a href="{% url 'status_page' %}">Status</a>
                <a href="{% url 'logout' %}">Logout</a>
            </nav>
        </header>

        <main class="content-container">
            {% block content %}
            {% endblock %}
        </main>

        <script>
            (function () {
                try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

                    if (!sessionStorage.getItem('tz_set')) {
                        fetch("/set_timezone/", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded",
                                "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
                            },
                            body: new URLSearchParams({ timezone: tz })
                        })
                        .then(() => {
                            sessionStorage.setItem('tz_set', '1');
                            location.reload();
                        })
                        .catch(() => {});
                    }
                } catch (e) {}
            })();
        </script>

<script>
setInterval(() => {
    fetch(window.location.href, { headers: { "X-Requested-With": "XMLHttpRequest" } })
        .then(response => response.text())
        .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            {% for item in site_data %}
            const newTS = doc.getElementById("timestamps-{{ item.site.id }}");
            if (!newTS) continue;

            const timestamps = JSON.parse(newTS.textContent);
            const labels = timestamps.map(ts => {
                const d = new Date(ts);
                return d.toLocaleString(undefined, {
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                });
            });

            const responseData = {{ item.response_times|safe|default:"[]" }};
            const fixedData = responseData.map(v =>
                (v === null || v === undefined) ? null : v
            );

            const chartObj = window["chart{{ item.site.id }}"];
            if (chartObj) {
                chartObj.data.labels = labels;
                chartObj.data.datasets[0].data = fixedData;
                chartObj.update();
            }
            {% endfor %}
        })
        .catch(err => console.error("Chart refresh error:", err));
}, 15000);
</script>


    </body>
</html>
